<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Campus Lost &amp; Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar"></header>

  <main class="main-content">
    <div class="page-header text-center">
      <h1 class="page-title">Campus Account Registration</h1>
      <p class="page-subtitle">Create a student or staff account to report lost belongings, claim found items, and track matches.</p>
    </div>

    <!-- Already Logged In Notice -->
    <div id="logged-in-notice" style="max-width: 520px; margin: 0 auto 1.25rem auto; display: none;"></div>

    <!-- Error / Success Alert Box -->
    <div id="alert-box" style="max-width: 520px; margin: 0 auto 1.25rem auto; display: none;"></div>

    <div class="form-card" style="max-width: 520px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border-subtle);">
        <span style="font-weight: 700; font-size: 1.05rem; color: var(--text-main);">New Student Profile</span>
        <button type="button" class="btn btn-secondary btn-sm" onclick="prefillSampleStudent()" style="font-size: 0.8rem;">
          ✨ Autofill Sample Student
        </button>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="name" 
            class="form-control" 
            placeholder="e.g. Rachel Adams" 
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Campus Email Address <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="e.g. rachel.a@college.edu" 
            autocomplete="email"
            required
          >
          <div class="form-hint">Used for match notifications and ownership verification.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Contact Phone / WhatsApp</label>
          <input 
            type="tel" 
            id="phone" 
            class="form-control" 
            placeholder="e.g. 9876543210" 
            autocomplete="tel"
          >
          <div class="form-hint">Allows finders or campus security to reach you upon match.</div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Create Password <span class="required">*</span></label>
            <button 
              type="button" 
              id="toggle-pwd-btn" 
              onclick="togglePasswordVisibility()" 
              style="background:none; border:none; color: var(--accent); font-size: 0.8rem; cursor: pointer; font-weight: 500;"
            >
              👁️ Show Passwords
            </button>
          </div>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Minimum 6 characters" 
            minlength="6" 
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password <span class="required">*</span></label>
          <input 
            type="password" 
            id="confirm-password" 
            class="form-control" 
            placeholder="Re-enter password to confirm" 
            minlength="6" 
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem; font-size: 1rem; padding: 0.75rem;">
          Create Campus Account
        </button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center; font-size: 0.9rem;">
        Already registered? <a href="login.html" style="font-weight: 600; color: var(--primary);">Sign in here &rarr;</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    renderHeader('register');
    renderFooter();

    const form = document.getElementById("register-form");
    const alertBox = document.getElementById("alert-box");
    const submitBtn = document.getElementById("submit-btn");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const loggedInNotice = document.getElementById("logged-in-notice");

    // Check existing login
    if (AppState.currentUser) {
      loggedInNotice.className = "alert alert-info";
      loggedInNotice.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; width:100%; flex-wrap:wrap; gap:0.75rem;">
          <div>
            <strong>Notice:</strong> Currently signed in as <strong>${escapeHtml(AppState.currentUser.name)}</strong>. Registering will create and switch to the new account.
          </div>
          <a href="dashboard.html" class="btn btn-secondary btn-sm">Go to Dashboard</a>
        </div>
      `;
      loggedInNotice.style.display = "block";
    }

    function togglePasswordVisibility() {
      const btn = document.getElementById("toggle-pwd-btn");
      const isPwd = passwordInput.type === "password";
      passwordInput.type = isPwd ? "text" : "password";
      confirmPasswordInput.type = isPwd ? "text" : "password";
      btn.textContent = isPwd ? "🙈 Hide Passwords" : "👁️ Show Passwords";
    }

    function prefillSampleStudent() {
      const randId = Math.floor(100 + Math.random() * 900);
      document.getElementById("name").value = `Student ${randId}`;
      document.getElementById("email").value = `student${randId}@college.edu`;
      document.getElementById("phone").value = `98765${randId}0`;
      document.getElementById("password").value = "student123";
      document.getElementById("confirm-password").value = "student123";
      showToast("Sample data filled! Click Create Campus Account to test.");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const phone = document.getElementById("phone").value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!name || !email || !password) {
        alertBox.className = "alert alert-danger";
        alertBox.innerHTML = "⚠️ Name, campus email, and password are required.";
        alertBox.style.display = "block";
        return;
      }

      if (password.length < 6) {
        alertBox.className = "alert alert-danger";
        alertBox.innerHTML = "⚠️ Password must be at least 6 characters long.";
        alertBox.style.display = "block";
        passwordInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        alertBox.className = "alert alert-danger";
        alertBox.innerHTML = "⚠️ Passwords do not match. Please re-enter your password.";
        alertBox.style.display = "block";
        confirmPasswordInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating Account...";
      alertBox.style.display = "none";

      try {
        const newUser = await apiFetch("/register", {
          method: "POST",
          body: JSON.stringify({ name, email, phone, password })
        });

        // Automatically log in with new user account
        AppState.setUser(newUser);
        showToast(`Welcome to Campus Lost & Found, ${newUser.name}!`);

        alertBox.className = "alert alert-success";
        alertBox.innerHTML = `✅ Account created successfully for <strong>${escapeHtml(newUser.name)}</strong>! Redirecting to your dashboard...`;
        alertBox.style.display = "block";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);

      } catch (err) {
        alertBox.className = "alert alert-danger";
        alertBox.innerHTML = `⚠️ ${escapeHtml(err.message || 'Registration failed')}`;
        alertBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Create Campus Account";
      }
    });
  </script>
</body>
</html>
